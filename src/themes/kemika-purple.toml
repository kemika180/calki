# calki theme — kemika-purple (personal). Purple-forward, from the kobo_tui palette:
# primary #5c3b8a, accent #cbb2ff, pink #b53580, bg #0f0f15, surface #141320, fg #e2e2e9.
# Syntax roles hand-picked. Omitted roles inherit Tokyo Night.

name = "kemika-purple"

[surfaces]
bg = "#0f0f15"
surface = "#141320"
panel_sel_bg = "#2a2440"
border_focused = "#cbb2ff"
border_dim = "#5c3b8a"
selection_bg = "#5c3b8a"
selection_fg = "#e2e2e9"

[text]
fg = "#e2e2e9"
fg_muted = "#6b6480"

[headings]
h1 = "#cbb2ff"
h2 = "#b899f0"
h3 = "#9f7fd8"
h4 = "#c98bd6"
h5 = "#7cd6c9"
h6 = "#ff79c6"

[markdown]
link = "#cbb2ff"
blockquote = "#7cd6c9"
hr = "#3a3350"
comment = "#6b6480"
list_marker = "#ff79c6"

[math]
math_lhs = "#cbb2ff"
math_operator = "#ff79c6"
math_number = "#7cd6c9"
math_result = "#7cd6c9"
math_unit = "#b53580"
math_fn = "#9f7fd8"

[help]
config_key = "#cbb2ff"
keybind_label = "#7cd6c9"
help_section = "#ff79c6"

[cursor]
cursor_normal = "#cbb2ff"
cursor_insert = "#7cd6c9"
cursor_visual = "#b53580"
cursor_search = "#ff79c6"

[editor]
editor_bg = "#0f0f15"
editor_fg = "#e2e2e9"
line_number = "#3a3350"

[status]
error = "#ff6b81"
